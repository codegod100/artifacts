name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # CLOUDFLARE_ACCOUNT_ID is optional — deploy.sh derives it from the
          # token via GET /accounts when unset. Set this secret to pin a
          # specific account if the token has access to more than one.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TANGLED_WEBHOOK_SECRET: ${{ secrets.TANGLED_WEBHOOK_SECRET }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: ./deploy.sh
